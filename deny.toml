# cargo-deny configuration
[advisories]
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSL-1.0",
    "GPL-2.0-only",
    "GPL-2.0-or-later",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

# hemtt crates use deprecated SPDX "GPL-2.0" — clarify to modern equivalent
[[licenses.clarify]]
name = "hemtt-preprocessor"
expression = "GPL-2.0-only"
license-files = [{ path = "LICENSE", hash = 0x00000000 }]

[[licenses.clarify]]
name = "hemtt-tokens"
expression = "GPL-2.0-only"
license-files = [{ path = "LICENSE", hash = 0x00000000 }]

[[licenses.clarify]]
name = "hemtt-error"
expression = "GPL-2.0-only"
license-files = [{ path = "LICENSE", hash = 0x00000000 }]

[bans]
multiple-versions = "deny"
skip = [
    # Old versions pulled in transitively — cannot easily upgrade
    { name = "getrandom", version = "0.2.17" },
    # r-efi and syn skips removed — cargo-deny warned unnecessary-skip (only one version)
    { name = "thiserror", version = "1.0.69" },
    { name = "thiserror-impl", version = "1.0.69" },
    { name = "winnow", version = "0.7.15" },
]
skip-tree = [
    { name = "hemtt-preprocessor" },
    { name = "loom" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
