[package]
name = "a3sql"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sqlparser = "0.62"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = "3.4"
lazy_static = "1.5"
libloading = "0.9"

# Error handling
thiserror = "2.0"

# Date/time support (lightweight, ~75KB)
time = { version = "0.3", features = ["formatting", "parsing"] }

# REGEXP operator support
regex = "1.11"

# UUID column type
uuid = { version = "1.16", features = ["v4", "serde"] }

# Ordered HashMap for column ordering in queries
indexmap = "2.7"

# Decimal type for DECIMAL(p,s) columns
rust_decimal = { version = "1.36", features = ["serde"] }

# SQL formatting for SHOW CREATE TABLE output
sqlformat = "0.5"

# Zero-copy binary serialization for persistence
rkyv = { version = "0.8.17", features = [] }

# arma-rs — C ABI generation + type-safe command routing + testing
arma-rs = "1.12"

# SQF literal parser — zero-copy nom parser for fast-path data ingestion
nom = "8"

# SQF command database — Arma 3 wiki data for full command recognition
arma3-wiki = "0.5"

# TOML config for version pinning and startup options
toml = "1.1"

# Vendored OpenSSL for reliable cross-compilation (i686, Windows)
openssl-sys = { version = "0.9", features = ["vendored"] }

# SQF preprocessor — macro expansion (#define, #include, #ifdef) for the
# slow-path SQF expression evaluator. Optional — falls back to direct lexing
# when disabled (no macros needed).
hemtt-preprocessor = { version = "1", optional = true }
hemtt-tokens = { version = "1", optional = true }

# Ed25519 signature verification for SQF query authentication.
ed25519-dalek = { version = "3", features = ["pkcs8"], optional = true }

[features]
default = ["sqf-preprocessor"]
sqf-preprocessor = ["hemtt-preprocessor", "hemtt-tokens"]
auth = ["ed25519-dalek"]


[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
proptest = "1.11"

[[bench]]
name = "queries"
harness = false
