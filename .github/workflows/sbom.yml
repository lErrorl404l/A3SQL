# Generate a CycloneDX SBOM for the a3sql extension at every release tag.
# Runs on tag push (any tag) plus manual dispatch, so provenance for a
# release does not depend on release-drafter. The SBOM is built from the
# tracked extension/Cargo.lock (F-04), which pins the dependency graph.
# The SBOM is uploaded as a workflow artifact, never committed.

name: SBOM

on:
  push:
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache-shared-key: a3sql-sbom-${{ hashFiles('extension/Cargo.lock') }}
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked --version 0.5.9
      - name: Generate SBOM
        run: |
          cargo cyclonedx --manifest-path extension/Cargo.toml --format json
          test -f extension/a3sql.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: a3sql-sbom-${{ github.ref_name }}
          path: extension/a3sql.cdx.json
          if-no-files-found: error
