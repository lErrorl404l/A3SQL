# a3db CI — test, cross-compile, build addon
#
# Builds the Rust extension for 4 targets:
#   x86_64-unknown-linux-gnu  → a3db_x64.so
#   i686-unknown-linux-gnu     → a3db_x86.so
#   x86_64-pc-windows-gnu      → a3db_x64.dll
#   i686-pc-windows-gnu        → a3db_x86.dll
#
# Then builds the Arma 3 addon PBOs with HEMTT.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  validate:
    name: SQF + config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup HEMTT
        uses: arma-actions/hemtt@v1
        with:
          annotate: true
      - name: HEMTT check
        run: hemtt check

  test:
    name: cargo test + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path extension/Cargo.toml --check
      - name: Clippy
        run: cargo clippy --manifest-path extension/Cargo.toml --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --manifest-path extension/Cargo.toml

  build-linux:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - i686-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
      - name: Install cross-compile deps (i686)
        if: matrix.target == 'i686-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - name: Build
        run: cargo build --release --manifest-path extension/Cargo.toml --target ${{ matrix.target }}
      - name: Rename artifact
        run: |
          arch=${{ contains(matrix.target, 'x86_64') && 'x64' || 'x86' }}
          mkdir -p extension/target/release
          mv target/${{ matrix.target }}/release/liba3db.so extension/target/release/a3db_${arch}.so
          ls -la extension/target/release/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: a3db-${{ matrix.target }}
          path: extension/target/release/a3db_*.so

  build-windows:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-pc-windows-gnu
          - i686-pc-windows-gnu
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: Build
        run: cargo build --release --manifest-path extension/Cargo.toml --target ${{ matrix.target }}
      - name: Rename artifact
        run: |
          arch=${{ contains(matrix.target, 'x86_64') && 'x64' || 'x86' }}
          mkdir -p extension/target/release
          mv target/${{ matrix.target }}/release/a3db.dll extension/target/release/a3db_${arch}.dll
          ls -la extension/target/release/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: a3db-${{ matrix.target }}
          path: extension/target/release/a3db_*.dll

  build-addon:
    name: HEMTT build
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    steps:
      - uses: actions/checkout@v4
      - name: Install HEMTT
        uses: arma-actions/hemtt@v1
      - name: Download all extension artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: a3db-*
          merge-multiple: true
          path: extension/target/release
      - name: Build addon
        run: hemtt build
      - name: Upload addon
        uses: actions/upload-artifact@v4
        with:
          name: a3db-addon
          path: .hemttout/build/

  release:
    name: Create release
    if: github.event_name == 'release'
    needs: [build-addon]
    runs-on: ubuntu-latest
    steps:
      - name: Download addon
        uses: actions/download-artifact@v4
        with:
          name: a3db-addon
          path: a3db
      - name: Create archive
        run: |
          cd a3db && zip -r ../a3db-release.zip .
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ./a3db-release.zip
          name: a3db-${{ github.event.release.tag_name }}

  workshop:
    name: Publish to Steam Workshop
    if: github.event_name == 'release' && secrets.STEAM_WORKSHOP_PUBLISHEDID != ''
    needs: [build-addon]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install HEMTT
        uses: arma-actions/hemtt@v1
      - name: Download addon
        uses: actions/download-artifact@v4
        with:
          name: a3db-addon
          path: .hemttout/build
      - name: Set publishedid
        run: |
          echo 'publishedid = ${{ secrets.STEAM_WORKSHOP_PUBLISHEDID }}' > meta.cpp
      - name: Publish
        run: hemtt publish --steam-user '${{ secrets.STEAM_USERNAME }}' --steam-pass '${{ secrets.STEAM_PASSWORD }}'
        env:
          HEMTT_STEAM_GUARD_CODE: ${{ secrets.STEAM_GUARD_CODE }}
