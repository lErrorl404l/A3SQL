# a3sql CI — test, cross-compile, build addon, release
# Uses org-wide reusable workflow for core pipeline.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ── Core pipeline (org-wide reusable) ───────────────────────────────
  ci:
    uses: lErrorl404l/.github/.github/workflows/rust-addon-ci.yml@main
    with:
      crate-name: a3sql
      crate-path: extension
      rust-cross: true

  # ── i686 Linux cross-compile (not in reusable workflow) ─────────────
  build-linux-i686:
    name: build i686-unknown-linux-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: i686-unknown-linux-gnu
      - name: Install cross-compile deps
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - name: Build
        run: cargo build --release --manifest-path extension/Cargo.toml --target i686-unknown-linux-gnu
      - name: Rename artifact
        run: |
          mkdir -p extension/target/release
          mv target/i686-unknown-linux-gnu/release/liba3sql.so extension/target/release/a3sql_x86.so 2>/dev/null || true
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: a3sql-i686-unknown-linux-gnu
          path: extension/target/release/a3sql_*.so

  # ── Addon build (depends on all build jobs) ─────────────────────────
  build-addon:
    name: HEMTT build
    runs-on: ubuntu-latest
    needs: [ci, build-linux-i686]
    steps:
      - uses: actions/checkout@v4
      - name: Install HEMTT
        uses: arma-actions/hemtt@v1
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: a3sql-*
          merge-multiple: true
          path: extension/target/release
      - name: Build addon
        run: hemtt build
      - name: Upload addon
        uses: actions/upload-artifact@v4
        with:
          name: a3sql-addon
          path: .hemttout/build/

  # ── Release ─────────────────────────────────────────────────────────
  release:
    name: Create release
    if: github.event_name == 'release'
    needs: [build-addon]
    runs-on: ubuntu-latest
    steps:
      - name: Download addon
        uses: actions/download-artifact@v4
        with:
          name: a3sql-addon
          path: a3sql
      - name: Create archive
        run: cd a3sql && zip -r ../a3sql-release.zip .
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ./a3sql-release.zip
          name: a3sql-${{ github.event.release.tag_name }}

  workshop:
    name: Publish to Steam Workshop
    if: github.event_name == 'release'
    needs: [build-addon]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install HEMTT
        uses: arma-actions/hemtt@v1
      - name: Download addon
        uses: actions/download-artifact@v4
        with:
          name: a3sql-addon
          path: .hemttout/build
      - name: Set publishedid
        run: echo 'publishedid = ${{ secrets.STEAM_WORKSHOP_PUBLISHEDID }}' > meta.cpp
      - name: Fetch changelog from release
        run: |
          echo 'CHANGE_NOTES<<EOF' >> $GITHUB_ENV
          gh release view "${{ github.event.release.tag_name }}" --json body --jq .body >> $GITHUB_ENV
          echo 'EOF' >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish
        run: |
          hemtt publish \
            --steam-user '${{ secrets.STEAM_USERNAME }}' \
            --steam-pass '${{ secrets.STEAM_PASSWORD }}' \
            --change-notes "$CHANGE_NOTES"
        env:
          HEMTT_STEAM_GUARD_CODE: ${{ secrets.STEAM_GUARD_CODE }}
