# a3sql CI — test, cross-compile, build addon, release
# Uses org-wide reusable workflow for core pipeline.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ── Core pipeline (org-wide reusable) ───────────────────────────────
  ci:
    uses: lErrorl404l/.github/.github/workflows/rust-addon-ci.yml@main
    with:
      crate-name: a3sql
      crate-path: extension
      rust-cross: true

  # ── i686 Linux cross-compile (not in reusable workflow) ─────────────
  build-linux-i686:
    name: build i686-unknown-linux-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: i686-unknown-linux-gnu
          cache-shared-key: a3sql-ci-linux32-${{ hashFiles('extension/Cargo.lock') }}
      - name: Install cross-compile deps
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - name: Build
        run: cargo build --release --manifest-path extension/Cargo.toml --target i686-unknown-linux-gnu
      - name: Rename artifact
        run: |
          mkdir -p extension/target/release
          mv extension/target/i686-unknown-linux-gnu/release/liba3sql.so extension/target/release/a3sql_x86.so 2>/dev/null || true
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: a3sql-i686-unknown-linux-gnu
          path: extension/target/release/a3sql_*.so

  # ── i686 Windows cross-compile ───────────────────────────────────────
  build-windows-i686:
    name: build i686-pc-windows-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: i686-pc-windows-gnu
          cache-shared-key: a3sql-ci-win32-${{ hashFiles('extension/Cargo.lock') }}
      - name: Install cross-compile deps
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: Build
        run: cargo build --release --manifest-path extension/Cargo.toml --target i686-pc-windows-gnu
      - name: Rename artifact
        run: |
          mkdir -p extension/target/release
          mv extension/target/i686-pc-windows-gnu/release/a3sql.dll extension/target/release/a3sql_x86.dll 2>/dev/null || true
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: a3sql-i686-pc-windows-gnu
          path: extension/target/release/a3sql_*.dll

  # ── Addon build (depends on all build jobs) ─────────────────────────
  build-addon:
    name: HEMTT build
    runs-on: ubuntu-latest
    needs: [ci, build-linux-i686, build-windows-i686]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Install HEMTT
        uses: arma-actions/hemtt@a0570ddd80d2b7be9c0f052494c0f700b42668dd # v1
      - name: Cache HEMTT
        uses: actions/cache@v4
        with:
          path: ~/.hemtt/cache
          key: hemtt-${{ hashFiles('.hemtt/**/*') }}
          restore-keys: hemtt-
      - name: Download extension binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # NO merge-multiple: several artifacts contain a file named
          # liba3sql.so (the addon package embeds one too) — flattening them
          # into one dir collides and overwrites nondeterministically, which
          # made the smoke test load a stale/partial binary. Each artifact
          # keeps its own subdirectory instead.
          pattern: a3sql-*
          path: extension/target/release
      - name: Rename extension binaries to Arma naming convention
        run: |
          # a3sql_x64.so (Linux 64-bit)
          if [ -f extension/target/release/a3sql-x86_64-unknown-linux-gnu/liba3sql.so ]; then
            cp extension/target/release/a3sql-x86_64-unknown-linux-gnu/liba3sql.so a3sql_x64.so
          fi
          # a3sql_x64.dll (Windows 64-bit)
          if [ -f extension/target/release/a3sql-x86_64-pc-windows-gnu/a3sql.dll ]; then
            cp extension/target/release/a3sql-x86_64-pc-windows-gnu/a3sql.dll a3sql_x64.dll
          fi
          # a3sql.so (Linux 32-bit)
          if [ -f extension/target/release/a3sql-i686-unknown-linux-gnu/a3sql_x86.so ]; then
            cp extension/target/release/a3sql-i686-unknown-linux-gnu/a3sql_x86.so a3sql.so
          fi
          # a3sql.dll (Windows 32-bit)
          if [ -f extension/target/release/a3sql-i686-pc-windows-gnu/a3sql_x86.dll ]; then
            cp extension/target/release/a3sql-i686-pc-windows-gnu/a3sql_x86.dll a3sql.dll
          fi
          ls -la a3sql*.so a3sql*.dll 2>/dev/null || echo "(no extension binaries present)"
      - name: SQL smoke test against real binary
        run: |
          # Run the mod's production SQL through the real extension ABI.
          # Fails the build if any statement misbehaves (engine regression gate).
          python3 tools/sql_smoke_test.py --bin a3sql_x64.so tools/smoke_test.sql
      - name: Build addon
        run: hemtt build
      - name: Upload addon
        uses: actions/upload-artifact@v7
        with:
          name: a3sql-addon
          path: .hemttout/build/

  # ── Release ─────────────────────────────────────────────────────────
  release:
    name: Create release
    if: github.event_name == 'release'
    needs: [build-addon]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Install HEMTT
        uses: arma-actions/hemtt@a0570ddd80d2b7be9c0f052494c0f700b42668dd # v1
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: a3sql-*
          merge-multiple: true
          path: extension/target/release
      - name: Rename extension binaries to Arma naming convention
        run: |
          # a3sql_x64.so (Linux 64-bit)
          if [ -f extension/target/release/liba3sql.so ]; then
            cp extension/target/release/liba3sql.so a3sql_x64.so
          fi
          # a3sql_x64.dll (Windows 64-bit)
          if [ -f extension/target/release/a3sql_x64.dll ]; then
            cp extension/target/release/a3sql_x64.dll a3sql_x64.dll
          elif [ -f extension/target/release/a3sql.dll ]; then
            cp extension/target/release/a3sql.dll a3sql_x64.dll
          fi
          # a3sql.so (Linux 32-bit) — already renamed by upstream job
          if [ -f extension/target/release/a3sql_x86.so ]; then
            cp extension/target/release/a3sql_x86.so a3sql.so
          fi
          # a3sql.dll (Windows 32-bit) — already renamed by upstream job
          if [ -f extension/target/release/a3sql_x86.dll ]; then
            cp extension/target/release/a3sql_x86.dll a3sql.dll
          fi
          ls -la a3sql*.so a3sql*.dll 2>/dev/null || echo "(no extension binaries present)"
      - name: Build release
        run: hemtt release
      - name: Upload release asset
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: releases/*.zip
          name: a3sql-${{ github.event.release.tag_name }}

  workshop:
    name: Publish to Steam Workshop
    if: github.event_name == 'release'
    needs: [build-addon]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - name: Install HEMTT
        uses: arma-actions/hemtt@a0570ddd80d2b7be9c0f052494c0f700b42668dd # v1
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: a3sql-*
          merge-multiple: true
          path: extension/target/release
      - name: Rename extension binaries to Arma naming convention
        run: |
          # a3sql_x64.so (Linux 64-bit)
          if [ -f extension/target/release/liba3sql.so ]; then
            cp extension/target/release/liba3sql.so a3sql_x64.so
          fi
          # a3sql_x64.dll (Windows 64-bit)
          if [ -f extension/target/release/a3sql_x64.dll ]; then
            cp extension/target/release/a3sql_x64.dll a3sql_x64.dll
          elif [ -f extension/target/release/a3sql.dll ]; then
            cp extension/target/release/a3sql.dll a3sql_x64.dll
          fi
          # a3sql.so (Linux 32-bit) — already renamed by upstream job
          if [ -f extension/target/release/a3sql_x86.so ]; then
            cp extension/target/release/a3sql_x86.so a3sql.so
          fi
          # a3sql.dll (Windows 32-bit) — already renamed by upstream job
          if [ -f extension/target/release/a3sql_x86.dll ]; then
            cp extension/target/release/a3sql_x86.dll a3sql.dll
          fi
          ls -la a3sql*.so a3sql*.dll 2>/dev/null || echo "(no extension binaries present)"
      - name: Set publishedid
        run: |
          ID=$(printf '%s' "${{ secrets.STEAM_WORKSHOP_PUBLISHEDID }}" | tr -dc '0-9')
          if [ -z "$ID" ]; then
            echo "::error::STEAM_WORKSHOP_PUBLISHEDID secret is missing or not numeric"
            exit 1
          fi
          # HEMTT expects `publishedid = <digits>;` in meta.cpp (regex: publishedid\s*=\s*(\d+);)
          sed -i "s/^publishedid = .*/publishedid = $ID;/" meta.cpp
          cat meta.cpp
      - name: Fetch changelog from release
        run: |
          echo 'CHANGE_NOTES<<EOF' >> $GITHUB_ENV
          gh release view "${{ github.event.release.tag_name }}" --json body --jq .body >> $GITHUB_ENV
          echo 'EOF' >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish
        run: |
          hemtt publish \
            --steam-user '${{ secrets.STEAM_USERNAME }}' \
            --steam-pass '${{ secrets.STEAM_PASSWORD }}' \
            --change-notes "$CHANGE_NOTES"
        env:
          HEMTT_STEAM_GUARD_CODE: ${{ secrets.STEAM_GUARD_CODE }}
