name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # cargo test runs in the org reusable workflow (rust-addon-ci.yml) — no
  # duplicate here.

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: miri
          toolchain: nightly
          cache-shared-key: a3sql-miri-${{ hashFiles('extension/Cargo.lock') }}
      # Miri is a single-interpreter UB detector — it cannot be parallelised,
      # so the FULL lib suite (504+ tests) takes ~9 min locally / ~34 min on CI.
      # It only adds value where UB can actually exist: the unsafe/FFI surface,
      # crypto (auth), rkyv serialization, ABI callbacks, envelope parsing and
      # stack-depth recursion. The remaining ~400 tests are pure safe-Rust logic
      # already covered by the native `test` job — miri adds nothing there.
      - run: cargo miri test --manifest-path extension/Cargo.toml --lib -- auth engine::serialize engine::index engine::functions::eval::test dispatch server engine::trigger
        env:
          MIRIFLAGS: -Zmiri-isolation-error=warn
