name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          # Stable cache key: replaces the automatic runner-image-hash key, so
          # cache only regenerates when deps change (not every commit or runner
          # image update) — one entry per job, no generation accumulation.
          cache-shared-key: a3sql-test-${{ hashFiles('extension/Cargo.lock') }}
      - run: cargo test --manifest-path extension/Cargo.toml

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          components: miri
          toolchain: nightly
          cache-shared-key: a3sql-miri-${{ hashFiles('extension/Cargo.lock') }}
      # Miri is a single-interpreter UB detector — it cannot be parallelised,
      # so the FULL lib suite (349 tests) takes ~9 min locally / ~34 min on CI.
      # It only adds value where UB can actually exist: the unsafe/FFI surface,
      # crypto (auth), rkyv serialization, ABI callbacks, envelope parsing and
      # stack-depth recursion. The remaining ~300 tests are pure safe-Rust logic
      # already covered by the native `test` job — miri adds nothing there.
      - run: cargo miri test --manifest-path extension/Cargo.toml --lib -- auth engine::serialize engine::index engine::functions::eval::test dispatch server engine::trigger
        env:
          MIRIFLAGS: -Zmiri-isolation-error=warn
