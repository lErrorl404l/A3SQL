name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Clippy runs in the org reusable workflow (rust-addon-ci.yml) — no
  # duplicate here.

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-shared-key: a3sql-deny-${{ hashFiles('extension/Cargo.lock') }}
      - uses: EmbarkStudios/cargo-deny-action@v2
        env:
          RUSTUP_TOOLCHAIN: stable
        with:
          manifest-path: extension/Cargo.toml

  machete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-shared-key: a3sql-machete-${{ hashFiles('extension/Cargo.lock') }}
      - uses: bnjbvr/cargo-machete@v0.9.2
