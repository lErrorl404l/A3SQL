# Stale issues/PRs config — auto-close inactive items
daysUntilStale: 60
daysUntilClose: 14
exemptLabels:
  - pinned
  - security
  - planned
staleLabel: stale
markComment: >
  This issue has been automatically marked as stale because it has not had
  recent activity. It will be closed in 14 days if no further activity occurs.
closeComment: false
