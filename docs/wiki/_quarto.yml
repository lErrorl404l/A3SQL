project:
  type: website
  output-dir: _site

website:
  title: "A3SQL Documentation"
  favicon: images/favicon.png
  site-url: https://lerrorl404l.github.io/A3SQL/
  repo-url: https://github.com/lErrorl404l/A3SQL
  repo-actions: [edit, issue]
  open-graph:
    image: images/social-preview.png
  twitter-card:
    image: images/social-preview.png
  page-navigation: true
  announcement:
    icon: info-circle
    dismissable: true
    content: "A3SQL 1.1.0 — CBA integration, runtime engine, apply functions"
    type: primary
  navbar:
    left:
      - href: index.qmd
        text: Home
      - text: "Getting Started"
        href: chapters/Getting-Started.qmd
      - text: "SQL"
        href: chapters/SQL-Dialect.qmd
      - text: "Runtime Engine"
        href: chapters/Runtime-Engine.qmd
      - text: "Networking"
        href: chapters/TCP-Connector.qmd
    right:
      - icon: github
        href: https://github.com/lErrorl404l/A3SQL
  search:
    location: navbar
    type: overlay
    copy-button: true
    show-item-context: tree
  sidebar:
    style: "docked"
    collapse-level: 1
    contents:
      - href: index.qmd
        text: Overview
      - section: "Chapters"
        contents:
          - section: "Getting Started"
            contents:
              - text: Getting Started
                href: chapters/Getting-Started.qmd
          - section: "SQL Reference"
            contents:
              - text: SQL Dialect
                href: chapters/SQL-Dialect.qmd
          - section: "Integration"
            contents:
              - text: Module Guide
                href: chapters/Module-Guide.qmd
              - text: Use Cases
                href: chapters/Use-Cases.qmd
              - text: Plugins
                href: chapters/Plugins.qmd
              - text: Patch Framework
                href: chapters/Patch-Framework.qmd
              - text: Runtime Engine
                href: chapters/Runtime-Engine.qmd
          - section: "Networking"
            contents:
              - text: TCP Connector
                href: chapters/TCP-Connector.qmd
              - text: Standalone Server
                href: chapters/Standalone-Server.qmd
          - section: "Operations"
            contents:
              - text: CBA Settings
                href: chapters/CBA-Settings.qmd
              - text: Security
                href: chapters/Security.qmd
          - section: "Development"
            contents:
              - text: Development Setup
                href: chapters/Development-Setup.qmd
              - text: Building
                href: chapters/Building.qmd
      - section: "Annexes"
        contents:
          - text: SQL Cheat Sheet
            href: annexes/SQL-Cheat-Sheet.qmd
          - text: SQL Compatibility Report
            href: annexes/SQL-Compatibility-Report.qmd
          - text: Production Readiness
            href: annexes/Production-Readiness.qmd
      - text: Support
        href: support.qmd

format:
  html:
    theme: cosmo
    filters:
      - auto-dark
    toc: true
    toc-depth: 3
    breadcrumbs: true
    code-copy: true
    code-tools: true
    anchor-sections: true
    smooth-scroll: true
    mermaid-format: js
    page-footer:
      left: "A3SQL — SQL database engine for Arma 3"
      right: "Licence: Arma Public License Share Alike (APL-SA)"
