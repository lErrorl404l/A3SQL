[config.file_type]
options.allow_no_extension = true

[config.cfgpatches_scope]
enabled = true

[sqf.banned_commands]
enabled = true

[sqf.banned_macros]
options.release = [
    "DEBUG_MODE_FULL",
    "DISABLE_COMPILE_CACHE",
    "ENABLE_PERFORMANCE_COUNTERS",
]

# Enable at Help severity (default) for catching bugs without breaking builds
[sqf.undefined]
enabled = true

# Enable at Help severity — warns about variable shadowing
[sqf.shadowed]
enabled = true

[sqf.not_private]
enabled = true

[config.source]
options.sqf_mission_event_warnings = false
