name = "A3DB"
prefix = "a3db"
mainprefix = "z"
author = "ABE Team"

[files]
include = [
    "*.dll",
    "*.so",
    "mod.cpp",
    "meta.cpp",
    "LICENSE",
    "logo_*.paa",
]

[version]
major = 0
minor = 1
patch = 0
git_hash = 0

# ── Hooks ────────────────────────────────────────────────────────────────
[hemtt.hooks]
pre_build = ["01_set_version"]
post_release = ["01_rename_zip"]

# Launch profiles moved to .hemtt/launch.toml
# Run: hemtt launch [profile]

# ── Signing ───────────────────────────────────────────────────────────────
[hemtt.signing]
keyname = "a3db_0.1.0"
# Path to the private key. On CI, use a GitHub secret or encrypted key file.
private_key = "keys/a3db.biprivatekey"
# ponytail: wine is available on this system — Arma 3 Tools DSSignFile runs via wine64
dsign = ["wine64", "/ext/SteamLibrary/steamapps/common/Arma 3 Tools/DSSignFile/DSSignFile.exe"]

# ── Release ──────────────────────────────────────────────────────────────
[hemtt.release]
folder = "a3db"
