name = "A3DB"
prefix = "a3db"
mainprefix = "z"
author = "ABE Team"

[files]
include = [
    "*.dll",
    "*.so",
    "mod.cpp",
    "meta.cpp",
    "LICENSE",
    "logo_*.paa",
]

[version]
major = 0
minor = 1
patch = 0
git_hash = 0

# ── Hooks ────────────────────────────────────────────────────────────────
[hemtt.hooks]
pre_build = ["01_set_version"]
post_release = ["01_rename_zip"]

# Launch profiles moved to .hemtt/launch.toml
# Run: hemtt launch [profile]

# ── Release ──────────────────────────────────────────────────────────────
[hemtt.release]
folder = "a3db"
