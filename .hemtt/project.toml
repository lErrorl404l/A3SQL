name = "A3DB"
prefix = "a3db"
mainprefix = "z"
author = "ABE Team"

[files]
include = [
    "*.dll",
    "*.so",
    "mod.cpp",
    "meta.cpp",
    "LICENSE",
    "logo_*.paa",
]

[version]
major = 0
minor = 1
patch = 0
git_hash = 0

# ── Hooks ────────────────────────────────────────────────────────────────
[hemtt.hooks]
pre_build = ["01_set_version"]

# ── Launch profiles ──────────────────────────────────────────────────────
[hemtt.launch.default]
workshop = ["450814997"]  # CBA_A3
mission = "test.VR"
parameters = ["-world=VR"]
file_patching = false

# ── Release ──────────────────────────────────────────────────────────────
[hemtt.release]
folder = "a3db"
