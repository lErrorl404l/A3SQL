name = "A3SQL"
prefix = "a3sql"
mainprefix = "z"
author = "lErrorl404l"

[files]
include = [
    "*.dll",
    "*.so",
    "mod.cpp",
    "meta.cpp",
    "LICENSE",
    "logo_*.paa",
]
# Docker test rig and build output are not part of the mod. Excluding them
# stops hemtt's tree walk hitting root-owned files left by test containers
# (e.g. tests/docker/configs/profiles) and failing with Permission denied.
exclude = [
    "tests/docker",
    ".hemttout",
    "target",
]

[version]
path = "addons/main/script_version.hpp"
# 0 = version purely from script_version.hpp, bumped at release time
# (matches ACE3/ACRE2/ZEN practice). Use 8 for a git-hash suffix.
git_hash = 0

# Launch profiles moved to .hemtt/launch.toml
# Run: hemtt launch [profile]

# ── Release ──────────────────────────────────────────────────────────────
[hemtt.release]
folder = "a3sql"
sign = true
archive = true

# ── Signing ──────────────────────────────────────────────────────────────
# Stable-key flow:
#   hemtt keys generate   # run locally, interactive password prompt
# Keep a3sql.hemttprivatekey OUT of VCS (it is gitignored).
# Do NOT commit private_key_hash — HEMTT hard-fails encrypted keys in CI.
# CI uses per-release ephemeral signing (hemtt release) instead.
[signing]
authority = "a3sql"

# ── Workshop ─────────────────────────────────────────────────────────────
# PublishedID set in meta.cpp (per-environment)
# PublishedID not included in repo — set locally for your workshop item
